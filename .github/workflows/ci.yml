name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PII guard
        run: scripts/pii_guard.sh
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: End-to-end run on synthetic data
        run: python -m wpf --as-of 2026-10-09
